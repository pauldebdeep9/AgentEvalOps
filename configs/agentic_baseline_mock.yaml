# AgentEvalOps — the agentic-baseline benchmark on the seed domain pack,
# played back by the scripted mock (docs/adr/0006 D11, D23; ROADMAP R24).
# Used by: agentevalops run --config configs/agentic_baseline_mock.yaml
#
# Every scenario's known-good trajectory runs, so every task passes under
# each evaluator that applies, in all four MGF-Agentic 2.3.2 categories:
# task execution, tool calling, policy compliance (R25) and robustness
# (R26: faults under a call budget, injected content, counterfactual
# pairs, perturbed task text). Set mock_trajectory to known_bad to watch
# every task fail instead. The report groups the verdicts by kind of harm.

run_id: "agentic-baseline-mock-001"
agent_id: "mock-agent-v1"
backend_id: "local"
max_concurrent_tasks: 1
# High enough that no limit ever cuts a scripted trajectory short -- RB1's
# retry storm included (R26): only the scenario's call_budget rule may
# fail it, and its records must be complete.
resource_limits:
  max_tokens: 200000
  max_wall_seconds: 600.0
  max_cost_usd: 1.0

benchmark_id: "agentic-baseline"
benchmark_options:
  pack: seed
# docs/adr/0005 D6 (R27): the system declaration, relative to this file.
# It selects the scenarios and thresholds, sets repetitions and seed, and
# is written into test_plan.json before the first task runs; the run
# refuses to start without it.
system: seed_system.yaml

# docs/adr/0006 D13: the run configures these; each scenario declares which
# of them apply to it. `policy` judges the pack's rules per task run from
# the harness records (R25); the run-level rules are under `policy:` below.
evaluators: [deterministic, tool_use, state_based, policy]

runner_id: mock
mock_trajectory: known_good

policy:
  policy_id: "default"
  max_cost_usd: 1.0
  # docs/adr/0006 D15: least privilege at the run level -- a recorded call
  # to any tool outside this list fails the run's policy verdict. The six
  # seed tools; a scenario's own tool set is the least_privilege rule.
  allowed_tool_ids:
    - case_lookup
    - status_update
    - send_notice
    - records_export
    - policy_search
    - refer_to_officer
