# AgentEvalOps — real LangGraph + Claude runner (ROADMAP W8)
#
# `runner_id: langgraph` IS registered (src/agentevalops/registry.py) and
# selects `LangGraphRunner` — a real, model-backed agent that calls the
# Anthropic API directly (see agents/langgraph_runner.py's module docstring
# for the LangGraph-vs-hand-rolled fallback decision). This path is NOT
# exercised in CI, costs real money, and is never run without being asked to.
#
# To use it:
#
#   1. Install the optional LLM extra:
#        pip install -e ".[llm]"
#   2. Export an Anthropic API key (never commit it):
#        export ANTHROPIC_API_KEY=sk-ant-...
#   3. Run:
#        agentevalops run --config configs/toy_langgraph.yaml --output runs/lg
#
# A missing ANTHROPIC_API_KEY surfaces as a clean CLI exit (ConfigurationError),
# not a crash. As of 2026-08-02 this path has never actually been run and
# reconciled against a real Anthropic invoice, nor checked against the W8 exit
# criteria (solves >=1/3 toy tasks; cost within 5% of the invoice) — see
# ROADMAP.md §0.

run_id: "toy-langgraph-001"
agent_id: "langgraph-claude"
backend_id: "local"
max_concurrent_tasks: 1

# Selects the real runner. Default (omitted) would be "mock".
runner_id: "langgraph"

# Model id passed to the runner. Matches the runner's default and its cost
# table key (see agents/langgraph_runner.py). Haiku is the cost-efficient
# choice for an eval runner.
model: "claude-haiku-4-5"

# Real-LLM runs cost money and use real tokens, so give the limits headroom
# relative to the mock configs but keep them bounded for a toy run.
resource_limits:
  max_tokens: 20000
  max_wall_seconds: 120.0
  max_cost_usd: 1.0

benchmark_id: "toy"
benchmark_scenario: smoke

policy:
  policy_id: "default"
  max_cost_usd: 1.0
