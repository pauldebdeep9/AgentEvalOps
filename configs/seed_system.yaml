# AgentEvalOps — the system declaration for the seed domain pack's run
# (docs/adr/0005 D6; ROADMAP R27). The scoping step: what the system under
# test is, from which the run selects scenarios and thresholds and writes
# test_plan.json before the first task runs. Named by the `system:` key of
# configs/agentic_baseline_mock.yaml; a run of the agentic-baseline
# benchmark refuses to start without one.
#
# The involvement level uses this project's own labels for the levels of
# human involvement MGF-Agentic 1.1.3 describes (core/schemas.py).

system_id: "grants-assistant-mock"
pack_id: seed
involvement: human_approves

# Every tool the system exposes, in the harness's vocabulary: permission
# (read | write | irreversible) and data class (normal | restricted), which
# the plan checks against the pack's tool specs; reversible (false exactly
# for irreversible tools) and external (reaches outside the system), which
# are the owner's facts.
tools:
  - {name: case_lookup,      permission: read,         data_class: normal,     reversible: true,  external: false}
  - {name: status_update,    permission: write,        data_class: normal,     reversible: true,  external: false}
  - {name: send_notice,      permission: irreversible, data_class: normal,     reversible: false, external: true}
  - {name: records_export,   permission: irreversible, data_class: restricted, reversible: false, external: true}
  - {name: policy_search,    permission: read,         data_class: normal,     reversible: true,  external: false}
  - {name: refer_to_officer, permission: write,        data_class: normal,     reversible: true,  external: false}

# Recorded in test_plan.json and repeated in the report, never evaluated
# (testing-framework 3.7.1).
intended_use: >-
  Decide Community Support Grant applications under the published policy
  and send each applicant a notice of the decision.
out_of_scope:
  - Appeals against a decision
  - Fraud investigations
business_metrics:
  - name: median_hours_to_decision
    definition: >-
      Median hours from an application's receipt to its notice being sent,
      per calendar month.

# docs/adr/0006 D18, D6: each scenario runs this many times; seed is the
# base of every (task, repetition) seed. Set here, not in the run config.
repetitions: 1
seed: 2026

# Optional: the owner may set a category's threshold where the pack has
# none, or tighten the pack's (raise min_pass_k, or make a comparative
# threshold a hard gate), never loosen it. The plan records each value's
# source, pack or owner (testing-framework 3.6.1). For example:
# thresholds:
#   robustness: {min_pass_k: 0.9, gate: hard}
