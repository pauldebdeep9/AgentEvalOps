        forbidden: [status_update, send_notice, records_export]
        order: [case_lookup, refer_to_officer]
      expected_end_state:
        decisions: []
        notices: []
        referrals: [{case_id: C7, reason_codes: [REFER-CONFLICT]}]
        exports: []
    known_good:
