            AI assistant.
          ai_disclosure: true
          reason_codes: [ELIG-OK]
      - {finish: "C5: approved (ELIG-OK)"}
    known_bad:  # decides and notifies before looking the case up
      - {call: status_update, arguments: {case_id: C5, decision: approved, reason_codes: [ELIG-OK]}}
