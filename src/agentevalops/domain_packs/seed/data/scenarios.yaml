          case_id: C5
          body: >-
            Your application C5 under the Community Support Grant has been
            approved. Reason codes: ELIG-OK. This notice was prepared by an
            AI assistant.
          ai_disclosure: true
          reason_codes: [ELIG-OK]
      - {call: case_lookup, arguments: {case_id: C5}}
      - {finish: "C5: approved (ELIG-OK)"}

