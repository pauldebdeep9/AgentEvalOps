# The AI Verify Testing Framework's 112 process checks as catalogue data
# (docs/adr/0007 D10; ROADMAP R28). One entry per check: the framework's
# identifier, its principle and scope, and this project's own label,
# classification, evidence pointers and ROADMAP rows -- all from
# docs/imda-alignment.md §4, which stays the rationale. Change an entry here
# first and that document in the same commit; tests/test_imda_alignment_doc.py
# fails until both agree.
#
# Identifiers and this project's own labels only: never paste the source's
# text here (CLAUDE.md, "Third-party framework text"). Every label, principle
# label and other text field is checked with scripts/check_catalogue_ip.py.
# The source's title and publisher are the publisher's own names, cited to
# pin the document (docs/adr/0007 D10, the wording guard's one exemption).
#
# `scope` is the framework's own scoping: both, generative or traditional.
# `classification` is what a test run contributes (§2 of the alignment doc):
# direct, partial, supporting, later (with `available_from`), organisational
# or traditional-only. `evidence` lists `scenarios` -- the scenarios that
# cite the check -- and `artefact:<file>#<field>` pointers into a format 0.6
# bundle. `rows` are ROADMAP §2b rows, or `built` for what the bundle had at
# format 0.4. `run_level` marks the five checks every executed scenario
# evidences; the seed pack's `every_scenario_cites` lists the same five.
source:
  id: testing-framework
  title: AI Verify Testing Framework for Traditional and Generative AI
  publisher: AI Verify Foundation, Singapore
  version: "2025"
  published: 2025-05-29
  url: https://file.go.gov.sg/aivtf-pdf.pdf
  sha256: 363e59d140896b2ab75dffe508b03a8339e164fcfdab192b61862fb86c282379
  retrieved_on: 2026-11-01
  ip_posture: identifiers-and-own-labels

# This project's short label for each principle; the evidence report's
# headings. 11 is shortened: the framework's full name fails the five-word
# rule (docs/adr/0007, Context).
principles:
  1: Transparency
  2: Explainability
  3: Repeatability / Reproducibility
  4: Safety
  5: Security
  6: Robustness
  7: Fairness
  8: Data Governance
  9: Accountability
  10: Human Agency and Oversight
  11: Inclusive growth and well-being

# What the loader holds the entries below to (docs/adr/0007 D10).
process_counts:
  total: 112
  direct: 2
  partial: 12
  supporting: 32
  later: 9
  organisational: 49
  traditional-only: 8

