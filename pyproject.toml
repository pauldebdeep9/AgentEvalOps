[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentevalops"
version = "0.1.0"
description = "Local-first agent evaluation platform for running, recording, and replaying evaluation loops."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["agent", "evaluation", "llm", "testing", "benchmark", "ai"]
authors = [
    { name = "AgentEvalOps contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# typer floor: 2026-08-02 incident, 49 CLI tests failed when the shared dev
# env was (transiently) downgraded to typer==0.12.0 by a sibling project.
# Diagnosed, not assumed: typer 0.12.0's get_click_type() has no branch for
# Optional/Union parameter types at all (confirmed with a minimal `str | None`
# probe, not just cli.py's `Path | None` -- this is a genuine, general typer
# API gap, not a cli.py style issue routable by respelling Optional). Bisected
# 0.12.0 (broken) .. 0.27.0 (known-good) by binary search on PyPI's version
# list: 0.15.3 still failed, but on a *different* bug (click's
# Parameter.make_metavar() gained a required `ctx` arg in newer click, and
# 0.15.3's own click range still permits the incompatible newest click);
# 0.15.4, the very next patch, resolves cleanly. True minimum: 0.15.4.
# Ceiling: no typer 1.0 exists yet; capped at the next major regardless, per
# the same policy applied to pyyaml and the dev extra below.
dependencies = [
    "typer>=0.15.4,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Ceilings below cap at the next major above the version verified working in
# this session (2026-08-02) -- not the next major above the old floor, since
# several of these had already drifted ahead of their stated minimum (e.g.
# pytest resolves to 9.x today though the floor said >=8) and are confirmed
# passing at that version. The goal is "an unknown future major can't break
# the gate silently," not "roll back to the original pin."
#
# ruff is the exception: it's pre-1.0, so its minor releases behave like
# majors -- 0.x minor bumps are where ruff adds new default lint rules, and
# a "<1" ceiling would let 0.16 (or any later 0.x) fail `ruff check` against
# code that hasn't changed. Pinned to the minor actually verified
# (0.15.14) rather than "<1". Do not relax this back to a wide range just
# because ruff hasn't hit 1.0 -- that's the reason for the tight ceiling,
# not a reason to loosen it.
#
# mypy and pytest were reviewed in the same pass and their existing
# next-major ceilings confirmed, not assumed: both were verified this
# session across every minor release currently published within their
# ceiling (mypy 2.0.0/2.1.0/2.3.0; pytest 9.0.0/9.1.1) against this
# repo's actual code -- identical results every time (mypy: clean on all
# 42 files; pytest: 571 passed, 1 skipped, 96% coverage). Unlike ruff,
# neither project's minor releases have introduced new checks that break
# already-clean code, at least not yet and not for this codebase.
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.15,<0.16",
    "mypy>=1.10,<3",
    "types-PyYAML>=6,<7",
    "build>=1.0,<2",
    "pre-commit>=3.0,<5",
    "import-linter>=2.13,<3",
]
# Model-backed runner dependencies (Risk #2: upstream churn — pins are exact,
# same discipline as commit aadbe89: an exact pin, not a range, for any SDK
# a real model-backed runner calls directly). NOT installed in CI; the
# langgraph/openai runners import these lazily so core stays importable
# without them.  The runner's current implementation uses the `anthropic` SDK
# directly (see agents/langgraph_runner.py fallback note); the langgraph /
# langchain-anthropic pins are declared for a future LangGraph port. `openai`
# backs agents/openai_runner.py (docs/adr/0001-...) — pinned to the version
# verified in this session's dev env (Sai2511), same as the anthropic pin.
llm = [
    "anthropic==0.75.0",
    "langgraph==1.0.10",
    "langchain-anthropic==1.0.0",
    "openai==1.83.0",
]
# OpenTelemetry instrumentation (ROADMAP W9). Optional + imported lazily so
# core stays importable and CI (which does not install this extra) is
# unaffected. Ranges for now; pin exactly when span export is implemented.
otel = [
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]
# SWE-bench harness + dataset export tooling (docs/benchmark_adapters.md D1,
# D6). Never imported by agentevalops itself (D2) -- this extra is for
# scripts/export_swebench_snapshot.py and row 16's harness subprocess, both
# outside the package. cbor2<6 is load-bearing, not a style choice: cbor2>=6
# (pulled in transitively via swebench's modal dependency) has no prebuilt
# wheel for this platform and needs a Rust toolchain to build from source;
# cbor2==5.9.0, which satisfies cbor2<6, was confirmed to still ship a
# pure-Python wheel. NOT installed in CI or Sai2608.
swebench = [
    "swebench==4.1.0",
    "cbor2<6",
]

[project.scripts]
agentevalops = "agentevalops.cli:main"

# Built-in benchmark adapters published through the public entry-point group
# so third-party packages can plug new adapters in by declaring the same
# group (see src/agentevalops/registry.py).
[project.entry-points."agentevalops.adapters"]
toy = "agentevalops.benchmarks.toy.adapter:ToyBenchmarkAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/agentevalops"]

[tool.ruff]
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that hit the real Anthropic API (require ANTHROPIC_API_KEY and the 'llm' extra; skipped by default and never run in CI).",
]

[tool.mypy]
python_version = "3.10"
strict = true

# anthropic is an optional extra (llm) imported lazily inside
# agents/langgraph_runner.py; it is NOT installed in CI (ci.yml installs only
# .[dev]), so let mypy tolerate the missing stubs rather than fail on
# import-not-found.
# Tradeoff accepted: this buys a light, churn-resistant CI at the cost of
# never type-checking calls against the real anthropic API surface. The
# alternative -- installing .[llm] in CI -- was rejected because it couples
# the gate to upstream SDK churn (Risk #2, ROADMAP.md §5), and because the
# runner already isolates the SDK behind a lazy import and an injectable
# client (agent_factory), so the untyped surface stays small and contained.
[[tool.mypy.overrides]]
module = ["anthropic.*"]
ignore_missing_imports = true

# opentelemetry is an optional extra imported lazily (see observability/); it is
# not installed in CI, so let mypy tolerate the missing stubs for W9 wiring.
[[tool.mypy.overrides]]
module = ["opentelemetry.*"]
ignore_missing_imports = true

# openai is an optional extra (llm) imported lazily inside
# agents/openai_runner.py; it is NOT installed in CI (ci.yml installs only
# .[dev]), so let mypy tolerate the missing stubs rather than fail on
# import-not-found. This is the exact bug that made main red for two commits
# during W8 (a lazily-imported optional dependency with no override) —
# verified by differential (see docs/adr/0001-... report / session notes):
# mypy is clean with openai installed AND this override present; uninstalling
# openai while keeping the override still passes; removing the override with
# openai uninstalled fails on import-not-found. Same tradeoff as the
# anthropic override above: light, churn-resistant CI at the cost of never
# type-checking calls against the real openai API surface, acceptable
# because the SDK is isolated behind a lazy import and an injectable client
# (agent_factory).
[[tool.mypy.overrides]]
module = ["openai.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["agentevalops"]
branch = true

[tool.coverage.report]
show_missing = true

# ROADMAP W13. Contracts are derived from ARCHITECTURE.md §4 (the source of
# truth for layering) -- not reverse-engineered from today's imports. A
# contract that fails is a finding to report, not something to loosen.
[tool.importlinter]
root_packages = ["agentevalops"]
include_external_packages = true

# ARCHITECTURE.md §1: "The architecture has three layers" (core lowest,
# adapter middle, edge/cli highest). §4: "core imports nothing from any
# adapter, engine, or bundle package -- the one hard rule everyone should
# keep true" and "Adapters depend on the core; the core never depends on
# adapters." The middle layer groups everything §1 calls "adapters" plus
# the three packages §1 says "sit alongside the adapters" (orchestration/,
# bundles/, replay/) plus registry.py and config/ (top-level per §4, not
# ranked separately from the adapters they serve -- registry.py imports
# concrete adapter classes to register them, which the ":" (non-independent)
# grouping below permits: it asserts a rank relative to cli/core, not
# mutual independence within the middle tier. That narrower, precise claim
# -- "no adapter module imports from a different adapter family" -- is the
# separate independence contract below.
[[tool.importlinter.contracts]]
name = "Layers: cli > (adapters + orchestration/bundles/replay/registry/config) > core (ARCHITECTURE.md §1, §4)"
type = "layers"
containers = ["agentevalops"]
layers = [
    "cli",
    "agents:benchmarks:bundles:config:evaluators:observability:orchestration:policy:registry:replay:reports:scorers:stores",
    "core",
]

# ARCHITECTURE.md §4: "Adapter modules import from the core, optionally
# from each other within the same adapter family, and from third-party
# libraries. No adapter module imports from a different adapter family."
# `agentevalops.cloud` is deliberately excluded: it does not exist yet
# (ROADMAP W17+), and an independence contract errors if a listed module
# doesn't exist rather than merely failing it -- add it here once cloud/
# is created.
[[tool.importlinter.contracts]]
name = "Adapter families are independent of each other (ARCHITECTURE.md §4)"
type = "independence"
modules = [
    "agentevalops.agents",
    "agentevalops.benchmarks",
    "agentevalops.evaluators",
    "agentevalops.observability",
    "agentevalops.policy",
    "agentevalops.reports",
    "agentevalops.scorers",
    "agentevalops.stores",
]

# ARCHITECTURE.md §4 directory-tree comment: "agents/langgraph_runner.py ...
# anthropic SDK is an optional `llm` extra, imported lazily." Confined to
# agents/ by omitting `agentevalops.agents` from source_modules below --
# that is the one package these are allowed in, expressed by leaving it out
# rather than by an ignore_imports exemption.
# allow_indirect_imports = true: the rule constrains where the *import
# statement* lives (agents/), not how far a name can be transitively
# reached from. registry.py resolving adapters by name must reference
# them -- that is correct composition, not a leak. Genuine layering leaks
# (e.g. core reaching into an adapter) are already caught by the layers
# contract above; this contract's job is narrower: keep the anthropic
# import statement itself out of every package except agents/.
[[tool.importlinter.contracts]]
name = "anthropic/langgraph/langchain_anthropic confined to agents/ (ARCHITECTURE.md §4)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agentevalops.benchmarks",
    "agentevalops.bundles",
    "agentevalops.cli",
    "agentevalops.config",
    "agentevalops.core",
    "agentevalops.evaluators",
    "agentevalops.observability",
    "agentevalops.orchestration",
    "agentevalops.policy",
    "agentevalops.registry",
    "agentevalops.replay",
    "agentevalops.reports",
    "agentevalops.scorers",
    "agentevalops.stores",
]
forbidden_modules = ["anthropic", "langgraph", "langchain_anthropic"]

# ARCHITECTURE.md §4 directory-tree comment: "observability/ ... W9
# scaffold" wraps OpenTelemetry, imported lazily (see §8). Confined to
# observability/ by omitting `agentevalops.observability` from
# source_modules, same rationale as the contract above.
# allow_indirect_imports = true: same reasoning as the anthropic contract
# above -- this constrains where the import statement lives, not
# transitive reachability. It passes vacuously today only because
# otel_setup.py has zero call sites; the moment W9 wires it into the
# registry-resolved orchestrator/runners, indirect reach through
# registry.py would otherwise trip this identically.
[[tool.importlinter.contracts]]
name = "opentelemetry confined to observability/ (ARCHITECTURE.md §4, §8)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agentevalops.agents",
    "agentevalops.benchmarks",
    "agentevalops.bundles",
    "agentevalops.cli",
    "agentevalops.config",
    "agentevalops.core",
    "agentevalops.evaluators",
    "agentevalops.orchestration",
    "agentevalops.policy",
    "agentevalops.registry",
    "agentevalops.replay",
    "agentevalops.reports",
    "agentevalops.scorers",
    "agentevalops.stores",
]
forbidden_modules = ["opentelemetry"]

# ARCHITECTURE.md §4: "`grep -r "boto3" src/` returns hits only in
# `src/agentevalops/cloud/aws/` ... The intended check isn't wired into
# CI." Wiring it now, before cloud/ exists, deliberately: `agentevalops.
# cloud` will be the one allowed package once created (excluded from
# source_modules the same way agents/ and observability/ are excluded
# above), but there is no cloud/ directory yet for boto3/botocore to be
# confined to or excluded from, so this contract is vacuous today -- it
# has nothing to check. It becomes load-bearing the moment W17 creates
# cloud/ and something outside it imports boto3.
# Note, corrected 2026-08-05 (docs/benchmark_adapters.md D2): this
# contract's vacuousness is about the *source* side (no cloud/ package
# exists to check) and says nothing about forbidden_modules tolerating an
# *uninstalled destination* module -- boto3 itself is installed in this
# env. That distinct question (does a `forbidden` contract error if its
# forbidden module isn't installed, the way an `independence` contract
# errors on a nonexistent source module per the comment above) was tested
# directly by the swebench contract below, with swebench genuinely
# absent: it does not error.
# allow_indirect_imports = true: same reasoning as the two contracts
# above. Once cloud/ exists and is registry-resolved like every other
# adapter family, indirect reach through registry.py would otherwise
# trip this identically -- constrain the import statement's location,
# not transitive reachability.
[[tool.importlinter.contracts]]
name = "boto3/botocore confined to cloud/ (ARCHITECTURE.md §4) -- vacuous until cloud/ exists, W17+"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agentevalops.agents",
    "agentevalops.benchmarks",
    "agentevalops.bundles",
    "agentevalops.cli",
    "agentevalops.config",
    "agentevalops.core",
    "agentevalops.evaluators",
    "agentevalops.observability",
    "agentevalops.orchestration",
    "agentevalops.policy",
    "agentevalops.registry",
    "agentevalops.replay",
    "agentevalops.reports",
    "agentevalops.scorers",
    "agentevalops.stores",
]
forbidden_modules = ["boto3", "botocore"]

# openai backs agents/openai_runner.py (docs/adr/0001-openai-runner-chat-
# completions.md). Kept as its own contract rather than folded into the
# anthropic/langgraph/langchain_anthropic one above: that contract's name and
# history are specifically about the Anthropic-backed runner's dependency
# set, and a second, independently-evolving provider SDK deserves a contract
# that can be read, proven, and changed on its own -- same reasoning that
# already gave opentelemetry and boto3/botocore each their own contract
# instead of merging into the anthropic one.
# allow_indirect_imports = true: same reasoning as the three contracts above
# -- constrains where the `import openai` statement lives (agents/), not how
# far the name is transitively reachable from; registry.py referencing
# OpenAIRunner to register it is correct composition, not a leak.
[[tool.importlinter.contracts]]
name = "openai confined to agents/ (ARCHITECTURE.md §4)"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "agentevalops.benchmarks",
    "agentevalops.bundles",
    "agentevalops.cli",
    "agentevalops.config",
    "agentevalops.core",
    "agentevalops.evaluators",
    "agentevalops.observability",
    "agentevalops.orchestration",
    "agentevalops.policy",
    "agentevalops.registry",
    "agentevalops.replay",
    "agentevalops.reports",
    "agentevalops.scorers",
    "agentevalops.stores",
]
forbidden_modules = ["openai"]

# ROADMAP row 14 / docs/benchmark_adapters.md D2: the upstream SWE-bench
# harness is invoked as a subprocess against its documented CLI
# (`python -m swebench.harness.run_evaluation`) and never imported -- unlike
# anthropic/openai/opentelemetry/boto3 above, there is no package this is
# confined *to*; no source module is omitted from the list below, because no
# module in this codebase is allowed to import it at all.
# Empirically verified before adding (docs/benchmark_adapters.md D2): unlike
# the `independence` contract type (which errors if a listed *internal*
# module doesn't exist, per the agentevalops.cloud comment above), this
# `forbidden` contract does not error when `swebench` itself isn't
# installed in the environment running `lint-imports` -- confirmed by
# running it with swebench absent (KEPT, vacuously) and with a direct
# `import swebench` injected into a source file (BROKEN, correctly), then
# reverting both. CI never installs `swebench` (D1), so this contract
# stays meaningful there.
[[tool.importlinter.contracts]]
name = "swebench never imported (docs/benchmark_adapters.md D2) -- subprocess only"
type = "forbidden"
source_modules = [
    "agentevalops.agents",
    "agentevalops.benchmarks",
    "agentevalops.bundles",
    "agentevalops.cli",
    "agentevalops.config",
    "agentevalops.core",
    "agentevalops.evaluators",
    "agentevalops.observability",
    "agentevalops.orchestration",
    "agentevalops.policy",
    "agentevalops.registry",
    "agentevalops.replay",
    "agentevalops.reports",
    "agentevalops.scorers",
    "agentevalops.stores",
]
forbidden_modules = ["swebench"]
